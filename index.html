<style>

</style>

<body>
<header>

<script>
const SUPABASE_URL = "https://xlllukczsozlslesyefd.supabase.co";
const SUPABASE_KEY = "sb_publishable_200ncSgnGI_PSjQSOH0xmA_d08ZHQlb";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const METIERS = ["Barbier","Coiffure","Onglerie","Maquillage","Esthétique","Cils et sourcils","Massage"];
const U = id => `https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=900&q=70`;
const PHOTOS = {
  "Barbier":U("1634480257305-7f4ca3582e6a"),
  "Coiffure":U("1634480258143-ffb5e6df0029"),
  "Onglerie":U("1457972729786-0411a3b2b626"),
  "Maquillage":U("1709477542170-f11ee7d471a0"),
  "Esthétique":U("1761718209835-c8586b7dcac0"),
  "Cils et sourcils":U("1728432757040-1579d710f607"),
  "Massage":U("1512290746430-3ffb4fab31bc"),
  "*":U("1709477542149-f4e0e21d590b")
};
const photoDe = f => f.photo_url || PHOTOS[f.metier] || PHOTOS["*"];
const bg = u => `background-image:url('${String(u).replace(/'/g,"%27")}')`;
function etoiles(n){n=Math.round(Number(n)||0);return `<span class="etoiles">${"★".repeat(n)}<span style="color:var(--line)">${"★".repeat(5-n)}</span></span>`}
function badgeNote(nt){return nt&&nt.nombre?`<span class="note-carte"><span class="etoiles">★</span>${Number(nt.moyenne).toFixed(1)} <span class="muted" style="font-weight:400">(${nt.nombre})</span></span>`:""}
function avatar(p,cls=""){const n=(p?.nom||"?").trim()[0]?.toUpperCase()||"?";return p?.photo_url?`<div class="avatar ${cls}" style="${bg(p.photo_url)}"></div>`:`<div class="avatar ${cls}">${esc(n)}</div>`}
const STATUTS_INSC = {a_payer:"À payer", paiement_annonce:"Paiement annoncé", confirmee:"Confirmée", refusee:"Refusée"};

let notesCache = {};
let session = null, profil = null, params = null;
let vue = "formations", detailId = null, editionId = null;
const URL_APP = "https://manurebord-ctrl.github.io/Beautyskol/";
try{const f=new URLSearchParams(location.search).get("f"); if(f){vue="detail";detailId=f;sessionStorage.setItem("bsk_entree","1");history.replaceState(null,"",location.pathname)}}catch(e){}
let filtres = {metier:"", type:""};
try{filtres.metier=localStorage.getItem("bsk_branche")||""}catch(e){}
let modeCompte = "connexion", typeInscr = "eleve", recuperation = false;

const $ = s => document.querySelector(s);
const app = () => $("#app");
function esc(t){return (t??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function chf(n){n=Number(n||0);return n===0?"Gratuit":"CHF "+n.toFixed(2).replace(".00",".-")}
function dateFr(d){if(!d)return"";return new Date(d).toLocaleString("fr-CH",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"})}
function jourFr(d){if(!d)return"";return new Date(d+"T12:00:00").toLocaleDateString("fr-CH",{day:"numeric",month:"long",year:"numeric"})}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",3200)}
function erreur(e){console.error(e);toast(e?.message ? "Erreur : "+e.message : "Une erreur est survenue")}
function lienSur(u){u=(u||"").trim();if(!u)return"";if(!/^https?:\/\//i.test(u))u="https://"+u;return u}
function aujourdhui(){return new Date().toISOString().slice(0,10)}
function formatriceValidee(p){return p && (p.role==="admin" || (p.role==="formatrice" && p.statut==="validee"))}
function taux(){return Number(params?.taux_commission ?? 10)}
function debutMois(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString()}

async function chargerProfil(){
  if(!session){profil=null;return}
  const {data} = await sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle();
  profil = data;
}
async function chargerParams(){
  const {data} = await sb.from("parametres").select("*").eq("id",1).maybeSingle();
  params = data || {taux_commission:10};
}

function aller(v, id){vue=v; if(typeof dernierCode!=="undefined") dernierCode=null; if(id!==undefined) detailId=id; window.scrollTo(0,0); rendre();}

function rendreNav(){
  const onglets = [["formations","Formations"],["cours","Mes cours"]];
  if(profil && (profil.role==="formatrice"||profil.role==="admin")) onglets.push(["formatrice","Formatrice"]);
  if(profil && profil.role==="admin") onglets.push(["admin","Admin"]);
  onglets.push(["inviter","Inviter"]);
  onglets.push(["compte", session?"Compte":"Connexion"]);
  $("#nav").classList.toggle("serre", onglets.length>5);
  const actif = vue==="detail"?"formations":(vue==="edition"?"formatrice":vue);
  const IC={
    formations:'<rect x="3" y="4" width="18" height="14" rx="3"/><path d="M10 8.5v5l4.5-2.5z"/><path d="M8 21h8"/>',
    cours:'<path d="M4 5.5C7 4 10 4.5 12 6c2-1.5 5-2 8-.5V19c-3-1.5-6-1-8 .5-2-1.5-5-2-8-.5z"/><path d="M12 6v13.5"/>',
    formatrice:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-4 4-5.5 7.5-5.5s6.3 1.5 7.5 5.5"/><path d="M17 4l1.2 1.2L20.5 3"/>',
    admin:'<path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6z"/><path d="M9 12l2 2 4-4"/>',
    inviter:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.3 6.5-5.3s5.7 1.7 6.5 5.3"/><path d="M19 8v6M16 11h6"/>',
    compte:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18.5c1.3-2.3 3.2-3.3 5.5-3.3s4.2 1 5.5 3.3"/>'
  };
  $("#nav").innerHTML = onglets.map(([k,l])=>`<button class="${k===actif?"on":""}" onclick="aller('${k}')"><svg viewBox="0 0 24 24">${IC[k]||""}</svg>${l}</button>`).join("");
}

async function rendre(){
  rendreNav();
  try{
    if(recuperation) return vueNouveauMdp();
    if(vue==="formations") return await vueFormations();
    if(vue==="detail") return await vueDetail();
    if(vue==="cours") return await vueCours();
    if(vue==="formatrice") return await vueFormatrice();
    if(vue==="edition") return await vueEdition();
    if(vue==="admin") return await vueAdmin();
    if(vue==="compte") return vueCompte();
    if(vue==="inviter") return vueInviter();
  }catch(e){erreur(e)}
}

/* ---------- PHOTOS ---------- */
function reduireImage(file,max){
  return new Promise((ok,ko)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{const r=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?ok(b):ko(new Error("image illisible")),"image/jpeg",.82)};
    img.onerror=()=>ko(new Error("image illisible")); img.src=url;
  });
}
async function envoyerPhoto(file,max){
  toast("Envoi de la photo...");
  const blob=await reduireImage(file,max);
  const chemin=`${session.user.id}/${Date.now()}.jpg`;
  const {error}=await sb.storage.from("photos").upload(chemin,blob,{contentType:"image/jpeg",upsert:false});
  if(error) throw error;
  return sb.storage.from("photos").getPublicUrl(chemin).data.publicUrl;
}

/* ---------- VIDEOS ---------- */
function idYoutube(u){u=(u||"").trim();const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/))([A-Za-z0-9_-]{11})/);return m?m[1]:null}
function lienEmbed(u){
  const y=idYoutube(u); if(y) return `https://www.youtube-nocookie.com/embed/${y}?rel=0&modestbranding=1&playsinline=1`;
  const v=(u||"").match(/vimeo\.com\/(?:video\/)?(\d+)/); if(v) return `https://player.vimeo.com/video/${v[1]}`;
  const d=(u||"").match(/drive\.google\.com\/file\/d\/([^/]+)/); if(d) return `https://drive.google.com/file/d/${d[1]}/preview`;
  return null;
}
function videosDe(a){let v=Array.isArray(a?.videos)?a.videos.filter(x=>x&&x.url):[];if(!v.length&&a?.video_url)v=[{titre:"Vidéo",url:a.video_url}];return v}
function salleJitsi(titre){
  const s=(titre||"formation").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"").slice(0,24)||"Formation";
  const r=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>"abcdefghjkmnpqrstuvwxyz23456789"[b%31]).join("");
  return `https://meet.jit.si/Beautyskol-${s}-${r}`;
}
function lienDirectPour(u,nom,formatrice){
  if(!/meet\.jit\.si\//.test(u||"")) return lienSur(u);
  const base=u.split("#")[0]; const n=encodeURIComponent(JSON.stringify(nom||"Beautyskol"));
  return formatrice ? `${base}#userInfo.displayName=${n}&config.prejoinPageEnabled=false`
                    : `${base}#userInfo.displayName=${n}&config.startWithAudioMuted=true&config.startWithVideoMuted=true&config.prejoinPageEnabled=false`;
}

async function ajouterVideo(depuisPressePapier){
  let url="";
  if(depuisPressePapier){
    try{url=(await navigator.clipboard.readText()||"").trim()}catch(e){}
    if(!/^https?:\/\//i.test(url)){toast("Aucun lien copié. Copie d'abord le lien dans YouTube.");return}
  }
  window._videos=window._videos||[];
  if(url&&window._videos.some(v=>v.url===url)) return toast("Cette vidéo est déjà ajoutée");
  window._videos.push({titre:window._videos.length?`Partie ${window._videos.length+1}`:"Vidéo",url});
  afficherVideos(); if(url) toast("Vidéo ajoutée");
}

      <button class="btn danger" onclick="deconnexion()">Se déconnecter</button>
      <button class="retour" style="display:block;margin:18px auto 0;color:var(--muted);font-weight:600;font-size:15px" onclick="supprimerCompte()">Supprimer mon compte</button>
      <p style="text-align:center"><a class="muted" href="confidentialite.html">Politique de confidentialité</a></p>`;
    return;
  }
  const connexion = modeCompte==="connexion";
  app().innerHTML = `
    <h2>${connexion?"Connexion":"Créer un compte"}</h2>
    <div class="rang">
      <button class="tuile ${connexion?"on":""}" onclick="modeCompte='connexion';rendre()">J'ai un compte</button>
      <button class="tuile ${!connexion?"on":""}" onclick="modeCompte='inscription';rendre()">Nouveau compte</button>
    </div>
    ${!connexion?`
      <label>Je suis</label>
      <div class="rang">
        <button class="tuile ${typeInscr==="eleve"?"on":""}" onclick="typeInscr='eleve';majType()" id="ti_e">Élève</button>
        <button class="tuile ${typeInscr==="formatrice"?"on":""}" onclick="typeInscr='formatrice';majType()" id="ti_f">Formatrice</button>
      </div>
      <label>Nom et prénom</label><input id="i_nom" autocomplete="name">
      <label>Métier</label><select id="i_metier"><option value="">-</option>${METIERS.map(m=>`<option>${m}</option>`).join("")}</select>
      <label>Ville</label><input id="i_ville">`:""}
    <label>E-mail</label><input id="i_mail" type="email" inputmode="email" autocomplete="email">
    <label>Mot de passe</label><input id="i_mdp" type="password" autocomplete="${connexion?"current-password":"new-password"}" placeholder="${connexion?"":"6 caractères minimum"}">
    <button class="btn plein" style="margin-top:20px" onclick="${connexion?"connexion()":"inscription()"}">${connexion?"Se connecter":"Créer mon compte"}</button>
    ${connexion?`<button class="btn" onclick="mdpOublie()">Mot de passe oublié</button>`:""}
  `;
}
function majType(){$("#ti_e").classList.toggle("on",typeInscr==="eleve");$("#ti_f").classList.toggle("on",typeInscr==="formatrice")}
const urlRetour = () => location.origin + location.pathname;
async function connexion(){
  const email=$("#i_mail").value.trim(), password=$("#i_mdp").value;
  if(!email||!password) return toast("Indique ton e-mail et ton mot de passe");
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) return toast(error.message.includes("confirm")?"Confirme d'abord ton e-mail (lien reçu par mail)":"E-mail ou mot de passe incorrect");
}
async function inscription(){
  const nom=$("#i_nom").value.trim(), email=$("#i_mail").value.trim(), password=$("#i_mdp").value;
  if(!nom||!email||password.length<6) return toast("Remplis nom, e-mail et un mot de passe de 6 caractères minimum");
  const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:urlRetour(),data:{nom,type:typeInscr,metier:$("#i_metier").value,ville:$("#i_ville").value.trim()}}});
  if(error) return erreur(error);
  if(!data.session){app().innerHTML=`<h2>Presque fini</h2><div class="boite ok">Un e-mail de confirmation a été envoyé à <b>${esc(email)}</b>. Ouvre-le et appuie sur le lien pour activer ton compte.</div><button class="btn" onclick="modeCompte='connexion';rendre()">Retour à la connexion</button>`}
}
async function mdpOublie(){
  const email=$("#i_mail").value.trim(); if(!email) return toast("Indique d'abord ton e-mail");
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:urlRetour()});
  if(error) return erreur(error); toast("E-mail envoyé pour changer le mot de passe");
}
function vueNouveauMdp(){
  app().innerHTML=`<h2>Nouveau mot de passe</h2><label>Nouveau mot de passe</label><input id="n_mdp" type="password" autocomplete="new-password"><button class="btn plein" onclick="changerMdp()">Enregistrer</button>`;
}
async function changerMdp(){
  const p=$("#n_mdp").value; if(p.length<6) return toast("6 caractères minimum");
  const {error}=await sb.auth.updateUser({password:p}); if(error) return erreur(error);
  recuperation=false; toast("Mot de passe changé"); aller("formations");
}
async function choisirPhotoProfil(inp){
  const file=inp.files[0]; if(!file) return;
  try{const u=await envoyerPhoto(file,500);const {error}=await sb.from("profiles").update({photo_url:u}).eq("id",session.user.id);if(error) throw error;await chargerProfil();toast("Photo enregistrée");rendre()}catch(e){erreur(e)}
}
async function sauverProfil(){
  const d={nom:$("#c_nom").value.trim(),telephone:$("#c_tel").value.trim(),metier:$("#c_metier").value,ville:$("#c_ville").value.trim()};
  if($("#c_bio")) d.bio=$("#c_bio").value.trim();
  const {error}=await sb.from("profiles").update(d).eq("id",session.user.id);
  if(error) return erreur(error); await chargerProfil(); toast("Profil enregistré"); rendre();
}
async function devenirFormatrice(){
  const {error}=await sb.from("profiles").update({role:"formatrice"}).eq("id",session.user.id);
  if(error) return erreur(error); await chargerProfil(); toast("Demande envoyée à l'administratrice"); aller("formatrice");
}
async function supprimerCompte(){
  if(!confirm("Supprimer définitivement ton compte, tes formations, tes codes, tes avis et tes photos ? Cette action ne peut pas être annulée.")) return;
  if(!confirm("Dernière confirmation : supprimer mon compte ?")) return;
  try{
    const l=await sb.storage.from("photos").list(session.user.id,{limit:1000});
    const f=(l.data||[]).map(o=>`${session.user.id}/${o.name}`); if(f.length) await sb.storage.from("photos").remove(f);
  }catch(e){}
  const {error}=await sb.rpc("supprimer_mon_compte"); if(error) return erreur(error);
  await sb.auth.signOut(); toast("Compte supprimé"); aller("formations");
}
async function deconnexion(){await sb.auth.signOut(); aller("formations")}

function entrer(ou){
  try{sessionStorage.setItem("bsk_entree","1")}catch(e){}
  $("#entree").style.display="none";
  if(ou==="formatrice"){ vue = (profil&&(profil.role==="formatrice"||profil.role==="admin")) ? "formatrice" : "compte"; if(vue==="compte"){modeCompte=session?"connexion":"inscription";typeInscr="formatrice"} }
  else vue="formations";
  window.scrollTo(0,0); rendre();
}
(function(){let vu=false;try{vu=sessionStorage.getItem("bsk_entree")==="1"}catch(e){}if(!vu)document.getElementById("entree").style.display="flex";})();

/* ---------- DEMARRAGE ---------- */
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
sb.auth.onAuthStateChange(async (ev, s)=>{
  session=s;
  if(ev==="PASSWORD_RECOVERY") recuperation=true;
  if(ev==="SIGNED_IN"||ev==="SIGNED_OUT"||ev==="PASSWORD_RECOVERY"){
    setTimeout(async()=>{await chargerProfil(); if(ev==="SIGNED_IN"&&vue==="compte") vue="formations"; rendre();},0);
  }
});
(async()=>{
  const {data}=await sb.auth.getSession(); session=data.session;
  await Promise.all([chargerProfil(), chargerParams()]);
  rendre();
})();
</script>
</body>
</html>
